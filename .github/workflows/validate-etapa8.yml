name: Validate Etapa 8
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "supabase/migrations/**"
      - ".github/workflows/validate-etapa8.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit --noPropertyAccessFromIndexSignature false --exactOptionalPropertyTypes false
      - name: Build
        run: bun run build
      - name: Tests
        run: bun run test
